<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content ="width=device-width, initial-scale=1.0">
<title>Admin Log - Perpanjang Langganan</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<style>
body { background:black; color:white; font-family:Arial; padding:20px; }
h1 { color:#00ff88; text-align:center; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th, td { border:1px solid #444; padding:10px; text-align:center; }
th { background:#111; }
button { padding:5px 10px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; }
button.confirmed { background:gray; cursor:default; }
button.delete { background:red; color:white; margin-left:5px; }
button.confirm { background:limegreen; color: black; }

.chatBox { margin-top:40px; }
#adminChatWindow {
    height:300px;
    overflow-y:auto;
    background: black;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}
.msgAdmin { background:#00ff88; color: black; padding:6px; margin:5px 0; border-radius:6px; }
.msgUser { background:black; color:white; padding:6px; margin:5px 0; border-radius:6px; }
</style>
</head>
<body>

<h1>Admin Log - Perpanjang Langganan</h1>

<table>
<thead>
<tr>
  <th>Email</th>
  <th>UID</th>
  <th>Jumlah</th>
  <th>Status</th>
  <th>Bukti</th>
  <th>Aksi</th>
</tr>
</thead>
<tbody id="logBody"></tbody>
</table>

<!-- ================== FITUR CHAT REALTIME ================== -->

<div class="chatBox">
<h2 style="color:#00ff88;">Balas Chat User</h2>

<table>
<thead>
<tr>
  <th>Email</th>
  <th>Aksi</th>
</tr>
</thead>
<tbody id="chatList"></tbody>
</table>

<div id="chatArea" style="display:none;">
    <h3 id="chatTitle"></h3>
    <div id="adminChatWindow"></div>
    <input type="text" id="adminMsg" placeholder="Tulis balasan..." 
       style="width:70%;padding:8px; background:#111; color:white; border:1px solid #444; border-radius:5px;"> <button onclick="sendAdminMsg()" style="background:limegreen;color:black;">Kirim</button>
    <button onclick="endAdminChat()" style="background:red;color:white;">Selesaikan Chat</button>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAuWAjpoztwQtCnrHyV18kRA5AaDFcsyGo",
  authDomain: "jurnal-trade-pro.firebaseapp.com",
  projectId: "jurnal-trade-pro"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const logBody = document.getElementById("logBody");


// ================= LOGIN ADMIN =================
auth.onAuthStateChanged(async user=>{
    if(!user){
        window.location.href="login.html";
        return;
    }
    const doc = await db.collection("users").doc(user.uid).get();
    if(!doc.exists || !doc.data().Isadmin){
        alert("Hanya admin yang bisa akses halaman ini!");
        window.location.href="login.html";
        return;
    }
    loadPendingPayments();
    loadChatList();
});


// ================= PENDING PAYMENT =================
function loadPendingPayments(){
    db.collection("pendingPayments")
      .orderBy("timestamp","desc")
      .onSnapshot(snapshot=>{
        logBody.innerHTML="";
        snapshot.forEach(doc=>{
            const data = doc.data();
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${data.email}</td>
                <td>${data.uid}</td>
                <td>${data.amount}</td>
                <td>${data.status}</td>
                <td>${data.bukti || '-'}</td>
                <td>
                    ${data.status==="pending" ? `<button class="confirm" onclick="confirmPayment('${doc.id}')">Konfirmasi</button>` 
                    : `<button class="confirmed" disabled>✓</button>`}
                    <button class="delete" onclick="deletePayment('${doc.id}')">Hapus</button>
                </td>
            `;
            logBody.appendChild(tr);
        });
    });
}

function confirmPayment(docId){
    db.collection("pendingPayments").doc(docId).update({
        status: "confirmed"
    });
}

function deletePayment(docId){
    if(confirm("Yakin ingin menghapus?")){
        db.collection("pendingPayments").doc(docId).delete();
    }
}


// ================= CHAT REALTIME (UPGRADE TANPA ARRAY) =================

const chatList = document.getElementById("chatList");
const adminChatWindow = document.getElementById("adminChatWindow");
let currentChat = null;
let unsubscribeChat = null;

function loadChatList(){
    db.collection("tempChat")
    .where("active","==",true)
    .onSnapshot(snapshot=>{
        chatList.innerHTML="";
        snapshot.forEach(doc=>{
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${doc.id}</td>
                <td><button onclick="openChat('${doc.id}')" style="background:limegreen;">Buka</button></td>
            `;
            chatList.appendChild(tr);
        });
    });
}

function openChat(email){
    currentChat = email;
    document.getElementById("chatArea").style.display="block";
    document.getElementById("chatTitle").innerText="Chat dengan: "+email;

    if(unsubscribeChat) unsubscribeChat();

    unsubscribeChat = db.collection("tempChat")
    .doc(email)
    .collection("messages")
    .orderBy("timestamp")
    .onSnapshot(snapshot=>{
        adminChatWindow.innerHTML="";
        snapshot.forEach(doc=>{
            const data = doc.data();
            const div = document.createElement("div");
            div.className = data.sender==="admin" ? "msgAdmin" : "msgUser";
            div.textContent = data.message;
            adminChatWindow.appendChild(div);
        });
        adminChatWindow.scrollTop = adminChatWindow.scrollHeight;
    });
}

function sendAdminMsg(){
    const input = document.getElementById("adminMsg");
    const msg = input.value.trim();
    if(!msg || !currentChat) return;

    db.collection("tempChat")
    .doc(currentChat)
    .collection("messages")
    .add({
        sender:"admin",
        message:msg,
        timestamp:Date.now()
    });

    input.value="";
}

async function endAdminChat(){
    if(!currentChat) return;
    if(confirm("Selesaikan dan hapus chat ini?")){

        const messages = await db.collection("tempChat")
        .doc(currentChat)
        .collection("messages")
        .get();

        messages.forEach(doc=>{
            doc.ref.delete();
        });

        await db.collection("tempChat").doc(currentChat).delete();

        if(unsubscribeChat) unsubscribeChat();
        document.getElementById("chatArea").style.display="none";
        currentChat=null;
    }
}

</script>
</body>
</html>
