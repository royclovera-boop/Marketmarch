<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<style>
body {
    margin:0;
    font-family:Arial, sans-serif;
    background:#0e1117;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
body::before {
    content:"";
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:0;
    background-color:#0e1117;
    background-image:
        radial-gradient(circle at 25% 25%, #00ff88 8%, transparent 9%),
        radial-gradient(circle at 35% 25%, #00ff88 8%, transparent 9%),
        radial-gradient(circle at 30% 35%, #00ff88 8%, transparent 9%);
    background-size:80px 80px;
    background-repeat:repeat;
    opacity:0.15;
}
.login-box{
    position: relative;
    z-index:1;
    background:#00ff88;
    padding:30px;
    border-radius:10px;
    width:300px;
    text-align:center;
}
h2{color:black;}
input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}
button{
    width:90%;
    padding:10px;
    background:black;
    color:#00ff88;
    font-weight:bold;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
button:hover{opacity:0.8;}
#renewBtn{
    position: fixed;
    top: 15px;
    right: 15px;
    background: limegreen;
    color: black;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1;
}
#renewBtn:hover{opacity:0.8;}
</style>
</head>

<body>

<button id="renewBtn" onclick="window.location.href='pay.html'">Perpanjang Akun</button>

<div class="login-box">
    <h2>LOGIN</h2>
    <input type="email" id="username" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Masuk</button>
    <br><br>
    <button onclick="window.location.href='register.html'">Register</button>
    <br><br>
    <!-- MENU KE CHET -->
    <button onclick="window.location.href='chet.html'">Pusat bantuan</button>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAuWAjpoztwQtCnrHyV18kRA5AaDFcsyGo",
    authDomain: "jurnal-trade-pro.firebaseapp.com",
    projectId: "jurnal-trade-pro"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

async function login(){
    const email = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if(!email || !password){
        alert("Email dan password harus diisi!");
        return;
    }

    try{
        const userCredential = await auth.signInWithEmailAndPassword(email,password);
        const user = userCredential.user;
        const doc = await db.collection("users").doc(user.uid).get();

        if(!doc.exists){
            alert("Data user tidak ditemukan!");
            return;
        }

        const data = doc.data();
        const now = new Date();

        if(data.expireDate && now > data.expireDate.toDate()){
            alert("Langganan Anda sudah habis!");
            window.location.href = "pay.html";
            return;
        }

        if(data.isAdmin){
            alert("Login Berhasil (Admin)!");
        } else {
            alert("Login Berhasil!");
        }

        window.location.href = "index.html";

    } catch(err){
        alert("Email atau password salah!");
        console.error(err);
    }
}
</script>

</body>
</html>
