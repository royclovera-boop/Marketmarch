<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trading journal</title>

<!-- 🔒 prevent flash before auth -->
<style>
body { display: none; }
</style>

<!-- apexcharts & html2pdf -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="style.css">
<style>
/* sidebar */
#sidebar {
    position: fixed; left: -220px; top: 0; width: 220px; height: 100%;
    background: #111; color: #fff; transition: 0.3s; z-index: 999;
    padding-top: 60px;
}
#sidebar.active { left: 0; }
#sidebar a {
    display: block; padding: 12px 20px; color: #fff; text-decoration: none;
    transition: 0.2s;
}
#sidebar a:hover { background: #333; }
#sidebartoggle {
    position: fixed; top: 15px; left: 15px;
    background: #222; color: #fff; border: none;
    font-size: 24px; cursor: pointer; border-radius: 6px;
    width: 40px; height: 40px; z-index: 1000;
}
.container { transition: margin-left 0.3s; margin-left: 0; }
.container.shift { margin-left: 220px; }

/* logout button */
#logoutbtn {
    position: fixed; top: 15px; right: 15px;
    background: red; color: white; border: none;
    padding: 8px 15px; border-radius: 6px;
    cursor: pointer; z-index: 999;
}
</style>
</head>
<body>

<!-- sidebar toggle -->
<button id="sidebartoggle">☰</button>

<!-- sidebar -->
<div id="sidebar">
    <a href="home.html">🏠 home</a>
    <a href="index.html">📊 dashboard</a>
    <a href="toko.html">🛒 toko</a>
    <a href="backtes.html">👤 profil</a>
    <a href="#" id="adminsidebar" style="display:none;">🛠️ admin log</a>
    <a href="setting.html">⚙️ setting</a>
</div>

<!-- logout -->
<button id="logoutbtn">logout</button>

<!-- journal container -->
<div class="container" id="journal">
<h1>trading journal</h1>

<div class="card top-card">
    <div>
        <label>saldo awal</label>
        <input type="number" id="saldoawal" value="0">
    </div>
    <div>
        <label>mata uang</label>
        <select id="currency">
            <option value="idr">idr (rp)</option>
            <option value="usd">usd ($)</option>
        </select>
    </div>
    <div>
        <label>tanggal mulai</label>
        <input type="date" id="startdate">
    </div>
    <div>
        <label>tanggal akhir</label>
        <input type="date" id="enddate">
    </div>
    <div>
        <button id="generaterange">tampilkan</button>
    </div>
    <div>
        <button id="downloadpdf">download pdf</button>
    </div>
</div>

<div class="card table-card">
    <table>
        <thead>
            <tr>
                <th>tanggal</th>
                <th>p/l</th>
                <th>saldo</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<div class="card chart-card">
    <div id="chart"></div>
    <div class="rank-box">
        <h3>rank trading</h3>
        <div id="rankresult">🥇 newbie</div>
    </div>
</div>

<div style="text-align:center; margin-top:20px;">
    <button id="renewsubscription" style="
        background: orange; 
        color: black; 
        border: none; 
        padding: 10px 20px; 
        border-radius: 8px; 
        font-weight: bold; 
        cursor: pointer;">
        perpanjang akun
    </button>
    <p style="margin-top:5px; font-size:0.9em; color:#ccc;">
        kirim bukti transfer via whatsapp setelah klik tombol
    </p>
    <a href="https://wa.me/6281528590989" target="_blank" style="display:inline-block; margin-top:5px;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/whatsapp.svg" alt="whatsapp" width="40">
    </a>
</div>

</div>

<script>
let chart;
const tbody = document.getelementbyid("tbody");

const firebaseconfig = {
    apikey: "aizasyauwajpoztwqtcnrhyv18kra5aadfcsygo",
    authdomain: "jurnal-trade-pro.firebaseapp.com",
    projectid: "jurnal-trade-pro"
};
if (!firebase.apps.length) firebase.initializeapp(firebaseconfig);
const auth = firebase.auth();
const db = firebase.firestore();

const sidebar = document.getelementbyid("sidebar");
const sidebartoggle = document.getelementbyid("sidebartoggle");
const container = document.queryselector(".container");

sidebartoggle.addeventlistener("click", ()=>{
    sidebar.classlist.toggle("active");
    container.classlist.toggle("shift");
});

function formatcurrency(val){
    let currency = document.getelementbyid("currency").value;
    return currency==="usd"? "$ "+val.tolocalestring("en-us") : "rp "+val.tolocalestring("id-id");
}
function formatdate(date){
    let d = date.getdate().tostring().padstart(2,'0');
    let m = (date.getmonth()+1).tostring().padstart(2,'0');
    let y = date.getfullyear();
    return `${d}-${m}-${y}`;
}

function generaterange(){
    let startval = document.getelementbyid("startdate").value;
    let endval = document.getelementbyid("enddate").value;
    if(!startval || !endval){ alert("pilih tanggal dulu!"); return; }

    let start = new date(startval);
    let end = new date(endval);
    if(end<start){ alert("tanggal akhir tidak boleh sebelum tanggal mulai!"); return; }

    tbody.innerhtml="";
    let diffdays = math.floor((end-start)/(1000*60*60*24))+1;
    for(let i=0;i<diffdays;i++){
        let currentdate = new date(start);
        currentdate.setdate(start.getdate()+i);
        tbody.innerhtml += `<tr>
            <td class="tanggal">${formatdate(currentdate)}</td>
            <td><input type="number" class="pl"></td>
            <td class="saldo">0</td>
        </tr>`;
    }
    hitung();
}

function hitung(){
    let saldoawal = parsefloat(document.getelementbyid("saldoawal").value)||0;
    let saldo = saldoawal;
    let prev = saldoawal;
    let candledata = [];

    document.queryselectorall("#tbody tr").foreach((row,index)=>{
        let input = row.queryselector(".pl");
        let saldocell = row.queryselector(".saldo");
        let pl = parsefloat(input.value)||0;

        saldo += pl;
        saldocell.innertext = formatcurrency(saldo);

        let open = prev;
        let close = saldo;
        let high = math.max(open,close);
        let low = math.min(open,close);

        candledata.push({x:index+1,y:[open,high,low,close]});
        prev = saldo;
    });

    updatechart(candledata);
    updaterank(saldo - saldoawal);
}

function updatechart(data){
    if(chart) chart.destroy();
    chart = new apexcharts(document.queryselector("#chart"),{
        chart:{type:'candlestick',height:400,background:'#161b22'},
        series:[{data:data}],
        theme:{mode:'dark'},
        plotoptions:{candlestick:{colors:{upward:'#00ff88',downward:'#ff4d4d'}}},
        xaxis:{type:'category'}
    });
    chart.render();
}

function updaterank(totalprofit){
    let rank="🥉 newbie";
    if(totalprofit>=100000000) rank="🏆 goldierd 🏆";
    else if(totalprofit>=10000000) rank="🏆 legend";
    else if(totalprofit>=1000000) rank="🎖️ master 🎖️";
    else if(totalprofit>=100000) rank="🎖️ elit";
    else if(totalprofit>=10000) rank="🥇 pro";
    else if(totalprofit>=1000) rank="🥈 rookie";
    else if(totalprofit<-10000000) rank="☣️ diseasesc";
    else if(totalprofit<-1000000) rank="👾 high holler";
    else if(totalprofit<-100000) rank="🎰 gembler";
    else if(totalprofit<-10000) rank="📳 noob";
    else if(totalprofit<-1000) rank="⚠️ newbot";

    document.getelementbyid("rankresult").innertext = rank;
}

const adminsidebar = document.getelementbyid("adminsidebar");
adminsidebar.style.display = "none";

auth.onauthstatechanged(async user=>{
    if(!user){
        window.location.replace("login.html");
        return;
    }

    const doc = await db.collection("users").doc(user.uid).get();
    if(!doc.exists){
        window.location.replace("pay.html");
        return;
    }

    const data = doc.data();

    if(data.expiredate && new date() > data.expiredate.todate()){
        alert("langganan anda sudah habis!");
        window.location.replace("pay.html");
        return;
    }

    if(data.isadmin){
        adminsidebar.style.display = "block";
        adminsidebar.addeventlistener("click", ()=> window.location.href="adminlog.html");
    }

    // 🔓 tampilkan halaman setelah valid
    document.body.style.display = "block";

    // ===== session & inactivity =====
    const session_duration = 60*60*1000; // 1 jam
    const inactive_limit = 3*60*1000;    // 3 menit
    let logouttimer, inactivitytimer;

    function logoutuser(){
        alert("anda logout karena tidak aktif atau session habis.");
        auth.signout().then(()=> window.location.replace("login.html"));
    }

    function resetinactivity(){
        cleartimeout(inactivitytimer);
        inactivitytimer = settimeout(logoutuser, inactive_limit);
    }

    ['mousemove','mousedown','keydown','scroll','touchstart'].foreach(evt=>{
        window.addeventlistener(evt, resetinactivity);
    });

    // simpan login timestamp di localstorage
    let logintime = localstorage.getitem("logintime");
    if(!logintime) localstorage.setitem("logintime", date.now());
    logintime = parseint(localstorage.getitem("logintime"));

    // timer session 1 jam
    logouttimer = settimeout(()=>{
        localstorage.removeitem("logintime");
        logoutuser();
    }, session_duration - (date.now() - logintime));

    resetinactivity();
});

document.getelementbyid("generaterange").addeventlistener("click", generaterange);
document.addeventlistener("input", hitung);

document.getelementbyid("downloadpdf").addeventlistener("click",()=>{
    html2pdf().from(document.getelementbyid("journal")).save("trading_journal.pdf");
});

document.getelementbyid("renewsubscription").addeventlistener("click",()=> window.location.href="pay.html");
document.getelementbyid("logoutbtn").addeventlistener("click", ()=> auth.signout().then(()=>window.location.replace("login.html")));
</script>
</body>
</html>
